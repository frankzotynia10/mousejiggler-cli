name: build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./... && go test ./...
      - run: GOOS=windows GOARCH=amd64 go vet ./...
      - name: Build Windows binaries
        run: |
          mkdir -p dist
          GOOS=windows GOARCH=amd64 go build -trimpath -ldflags "-H windowsgui -s -w" -o dist/jiggler-windows-amd64.exe .
          GOOS=windows GOARCH=arm64 go build -trimpath -ldflags "-H windowsgui -s -w" -o dist/jiggler-windows-arm64.exe .
      - name: Package Stream Deck plugin
        run: |
          cd streamdeck
          cp ../dist/jiggler-windows-amd64.exe com.github.frankzotynia10.mousejiggler.sdPlugin/jiggler.exe
          zip -r ../dist/mousejiggler.streamDeckPlugin com.github.frankzotynia10.mousejiggler.sdPlugin
      - uses: actions/upload-artifact@v4
        with:
          name: jiggler-windows
          path: |
            dist/*.exe
            dist/*.streamDeckPlugin
      - name: Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.exe
            dist/*.streamDeckPlugin
